name: zelon_messenger
description: "Zelon Messenger Professional Mobile Application with Real-Time Sync, Dedicated Groups, and Role-Based Permissions"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  local_auth: ^2.2.0
  url_launcher: ^6.3.0
  flutter_pdfview: ^1.4.0
  path_provider: ^2.1.2
  record: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_platform_interface: 1.5.0

flutter:
  uses-material-design: true
